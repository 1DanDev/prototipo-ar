<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Historias que Inspiran — AR</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div id="intro">
    <div class="intro-card">
      <div class="eyebrow">HISTORIAS QUE INSPIRAN</div>
      <h1>Descubre sus historias</h1>
      <p>Apunta la cámara hacia una de las personas del mural.</p>
      <p class="small">Esta es la primera prueba técnica de realidad aumentada.</p>
    </div>
  </div>

  <div id="found-card" class="hidden">
    <div class="found-inner">
      <div class="found-label">HISTORIA ENCONTRADA</div>
      <h2 id="person-name">—</h2>
      <p id="person-copy">—</p>
    </div>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiError: no;
      uiLoading: no;
      uiScanning: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0: Denisse -->
    <a-entity mindar-image-target="targetIndex: 0" data-name="Dra. Denisse Barrientos Arquelles">
      <a-text
        value="HISTORIA ENCONTRADA"
        color="#cfc2ff"
        align="center"
        width="1.8"
        position="0 0.65 0"
        animation="property: position; to: 0 0.75 0; dur: 900; easing: easeInOutQuad; loop: true; dir: alternate">
      </a-text>
      <a-ring
        color="#b59cff"
        radius-inner="0.18"
        radius-outer="0.21"
        position="0 0 0.02"
        animation="property: rotation; to: 0 0 360; dur: 2200; loop: true; easing: linear">
      </a-ring>
    </a-entity>

    <!-- Targets 1–5: reserved for the next test -->
    <a-entity mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"></a-entity>
    <a-entity mindar-image-target="targetIndex: 4"></a-entity>
    <a-entity mindar-image-target="targetIndex: 5"></a-entity>
  </a-scene>

<script>
const people = {
  0: {
    name: "Dra. Denisse Barrientos Arquelles",
    copy: "Esta es una prueba de reconocimiento del mural."
  },
  1: { name: "Dra. Esther Lugo", copy: "" },
  2: { name: "Ing. Rubí Hernández Luis", copy: "" },
  3: { name: "Dra. María Martínez López", copy: "" },
  4: { name: "Dra. Patricia Gallegos", copy: "" },
  5: { name: "M.C. Mónica Edith García García", copy: "" }
};

const intro = document.querySelector("#intro");
const card = document.querySelector("#found-card");
const nameEl = document.querySelector("#person-name");
const copyEl = document.querySelector("#person-copy");

document.querySelectorAll("[mindar-image-target]").forEach((targetEl, index) => {
  targetEl.addEventListener("targetFound", () => {
    const data = people[index] || people[0];
    nameEl.textContent = data.name;
    copyEl.textContent = data.copy || "Próximamente conocerás su historia.";
    intro.classList.add("hidden");
    card.classList.remove("hidden");
  });

  targetEl.addEventListener("targetLost", () => {
    card.classList.add("hidden");
  });
});
</script>
</body>
</html>
