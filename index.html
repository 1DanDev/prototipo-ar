<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prueba AR.js NFT</title>
    <!-- Importamos A-Frame y AR.js con soporte para NFT -->
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <style>
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- Pantalla de carga mientras se procesan los archivos NFT -->
    <div class="arjs-loader">
      <div>Cargando marcador...</div>
    </div>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam;debugUIEnabled: false;"
    >
      <!--
        La propiedad 'url' apunta al nombre base de los archivos.
        IMPORTANTE: NO incluyas las extensiones (.fset, .iset).
      -->
      <a-nft
        type="nft"
        url="./Gemini_Generated_Image_3m9a8w3m9a8w3m9a"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      >
        <!-- Objeto 3D que aparecerá sobre la imagen (una caja roja) -->
        <a-box position="0 50 0" scale="50 50 50" color="red"></a-box>
      </a-nft>

      <!-- Cámara estática para que la escena funcione -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
