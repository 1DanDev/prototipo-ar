<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Historias que Inspiran</title>

  <!-- El parámetro v evita que GitHub Pages/el celular reutilicen el CSS anterior. -->
  <link rel="stylesheet" href="./css/styles.css?v=4.0.0">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <!-- UI HTML superpuesta a la cámara. No forma parte de la escena 3D. -->
  <main id="ar-ui" class="ar-ui">

    <!-- ESTADO 1: tutorial inicial -->
    <section id="onboarding" class="onboarding" aria-labelledby="tutorial-title">
      <div class="tutorial-card" role="dialog" aria-modal="true">
        <span class="tutorial-icon" aria-hidden="true">✦</span>
        <h1 id="tutorial-title">Historias que inspiran en AR</h1>
        <ol>
          <li>Concede permisos de cámara.</li>
          <li>Apunta al cartel completo o a los rostros de las científicas para descubrir sus historias.</li>
        </ol>
        <button id="start-button" class="button button-primary" type="button">
          Comenzar a Escanear
        </button>
      </div>
    </section>

    <!-- ESTADO 2: búsqueda activa -->
    <section id="scan-ui" class="scan-ui hidden" aria-live="polite" hidden>
      <p class="scan-hint">Apunta al cartel o a un rostro</p>
      <div class="scanner-frame" aria-hidden="true">
        <i class="corner corner-tl"></i>
        <i class="corner corner-tr"></i>
        <i class="corner corner-bl"></i>
        <i class="corner corner-br"></i>
        <span class="scan-line"></span>
      </div>
    </section>

    <!-- ESTADO 3A: cartel completo detectado -->
    <section id="poster-result" class="poster-result hidden" aria-live="polite" hidden>
      <a id="fanzine-link" class="button button-fanzine"
        href="./fanzine.html">
        Abrir Fanzine Interactivo
      </a>
    </section>

    <!-- Imagen HTML estable: no tiembla cuando MindAR pierde algunos fotogramas. -->
    <div id="fixed-image-container" class="fixed-image-container hidden" hidden>
      <img id="fixed-image" class="fixed-image" src="" alt="" draggable="false">
    </div>

    <button id="close-ar" class="close-ar hidden" type="button"
      aria-label="Cerrar historia y escanear otra" hidden>
      ×
    </button>

    <!-- ESTADO 3B: mujer detectada -->
    <section id="story-card" class="story-card hidden" aria-live="polite" hidden>
      <div class="story-content">
        <p class="story-kicker">Historia que inspira</p>
        <h2 id="story-name"></h2>
        <p id="story-quote" class="story-quote"></p>

        <div class="story-actions">
          <button id="audio-button" class="audio-button" type="button">
            <span class="audio-icon" aria-hidden="true">▶</span>
            <span id="audio-button-label">Reproducir audio</span>
          </button>

          <a id="learn-more-link" class="button button-primary" href="#">
            Saber más
          </a>

          <button id="scan-again-button" class="button button-secondary" type="button">
            <span aria-hidden="true">↻</span>
            <span>Escanear otra historia</span>
          </button>
        </div>
      </div>

      <audio id="story-audio" preload="none"></audio>
    </section>

  </main>


  <a-scene

    id="ar-scene"

    mindar-image="
      imageTargetSrc: ./targets/targets.mind;
      uiError: yes;
      uiLoading: yes;
      uiScanning: no;
      missTolerance: 30;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"
  >


    <!-- ================================================= -->
    <!-- RECURSOS -->
    <!-- ================================================= -->

    <a-assets timeout="15000">

      <!-- MODELO ANIMADO DEL TARGET 0 -->

      <a-asset-item
        id="modelo-mujeres"
        src="./assets/models/mural.glb"
      >
      </a-asset-item>

    </a-assets>



    <!-- ================================================= -->
    <!-- CÁMARA -->
    <!-- ================================================= -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>



    <!-- ================================================= -->
    <!-- TARGET 0 -->
    <!-- MODELO MUJERES.GLB -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 0"
      data-person-id="titulo"
    >

      <a-gltf-model

        id="modelo-mujeres-ar"

        src="#modelo-mujeres"

        position="0 0 0.05"

        rotation="0 0 0"

        scale="0.3 0.3 0.3"

        animation-mixer

      >
      </a-gltf-model>

    </a-entity>



    <!-- ================================================= -->
    <!-- TARGET 1: DENISSE -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 1"
      data-person-id="denisse"
    ></a-entity>



    <!-- ================================================= -->
    <!-- TARGET 2: ESTHER -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 2"
      data-person-id="esther"
    ></a-entity>



    <!-- ================================================= -->
    <!-- TARGET 3: RUBÍ -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 3"
      data-person-id="rubi"
    ></a-entity>



    <!-- ================================================= -->
    <!-- TARGET 4: MARÍA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 4"
      data-person-id="maria"
    ></a-entity>



    <!-- ================================================= -->
    <!-- TARGET 5: PATRICIA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 5"
      data-person-id="patricia"
    ></a-entity>



    <!-- ================================================= -->
    <!-- TARGET 6: MÓNICA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 6"
      data-person-id="monica"
    ></a-entity>


  </a-scene>


  <!-- El orden es importante: audio -> UI -> conexión con MindAR. -->
  <script src="./js/audio.js?v=4.0.0"></script>
  <script src="./js/app.js?v=4.0.0"></script>
  <script src="./js/ar.js?v=4.0.0"></script>

</body>

</html>
