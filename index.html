<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Historias que Inspiran</title>

  <link rel="stylesheet" href="./css/styles.css">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<script>
  document.addEventListener("DOMContentLoaded", () => {

    function ocultarVR() {

      const botonesVR = document.querySelectorAll(
        ".a-enter-vr, .a-enter-vr-button"
      );

      botonesVR.forEach((boton) => {
        boton.remove();
      });

    }

    // Intentar inmediatamente
    ocultarVR();

    // Intentar después de que A-Frame cargue
    setTimeout(ocultarVR, 500);
    setTimeout(ocultarVR, 1000);
    setTimeout(ocultarVR, 2000);

  });
</script>
<body>


  <!-- ================================================= -->
  <!-- TARJETA DE INFORMACIÓN -->
  <!-- ================================================= -->

  <section
  id="story-card"
  class="story-card hidden"
  aria-live="polite"
>

  <!-- <h2 id="story-name"></h2> -->

  <p id="story-quote"></p>

  <button
    id="more-button"
    type="button"    
  >
    Ver más
  </button>

  <button
    id="audio-button"
    type="button"
  >
    ▶ Escuchar
  </button>

  <audio
    id="story-audio"
    preload="none"
  ></audio>

</section>

  <!-- ================================================= -->
  <!-- IMAGEN FIJA -->
  <!-- ================================================= -->

  <div id="fixed-image-container">

    <img
      id="fixed-image"
      src=""
      alt=""
      draggable="false"
    >

  </div>

  <!-- ================================================= -->
  <!-- BOTÓN X -->
  <!-- ================================================= -->

  <button
    id="close-ar"
    type="button"
    aria-label="Cerrar imagen"
  >
    ✕
  </button>

  <!-- ================================================= -->
  <!-- ESCENA AR -->
  <!-- ================================================= -->

  <a-scene

    id="ar-scene"
    vr-mode-ui="enabled: false"

    mindar-image="
      imageTargetSrc: ./targets/targets.mind;
      uiError: yes;
      uiLoading: yes;
      uiScanning: no;
      missTolerance: 30;
    "
    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true
    "
    device-orientation-permission-ui="enabled: false"
  >
    <!-- ================================================= -->
    <!-- RECURSOS -->
    <!-- ================================================= -->

    <a-assets timeout="15000">

      <!-- IMÁGENES -->
      
      <img
        id="overlay-denisse"
        src="./assets/images/denisse.png"
      >

      <img
        id="overlay-esther"
        src="./assets/images/esther-06.png"
      >

      <img
        id="overlay-rubi"
        src="./assets/images/rubí.png"
      >

      <img
        id="overlay-maria"
        src="./assets/images/maria.png"
      >

      <img
        id="overlay-patricia"
        src="./assets/images/patricia.png"
      >

      <img
        id="overlay-monica"
        src="./assets/images/monica.png"
      >


      <!-- MODELO 3D -->

      <a-asset-item
        id="modelo-mujeres"
        src="./assets/models/mural.glb"
      ></a-asset-item>

    </a-assets>



    <!-- ================================================= -->
    <!-- CÁMARA -->
    <!-- ================================================= -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>



    <!-- ================================================= -->
    <!-- TARGET 0 -->
    <!-- MURAL 3D -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 0"
      data-person-id="titulo"
    >

      <a-gltf-model
        id="modelo-mujeres-ar"
        src="#modelo-mujeres"
        position="0 0 0.05"
        rotation="0 0 0"
        scale="0.3 0.3 0.3"
        animation-mixer
      ></a-gltf-model>

    </a-entity>

    <!-- ================================================= -->
    <!-- TARGET 1 -->
    <!-- DENISSE -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 1"
      data-person-id="denisse"
    ></a-entity>

    <!-- ================================================= -->
    <!-- TARGET 2 -->
    <!-- ESTHER -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 2"
      data-person-id="esther"
    ></a-entity>

    <!-- ================================================= -->
    <!-- TARGET 3 -->
    <!-- RUBÍ -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 3"
      data-person-id="rubi"
    ></a-entity>

    <!-- ================================================= -->
    <!-- TARGET 4 -->
    <!-- MARÍA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 4"
      data-person-id="maria"
    ></a-entity>

    <!-- ================================================= -->
    <!-- TARGET 5 -->
    <!-- PATRICIA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 5"
      data-person-id="patricia"
    ></a-entity>

    <!-- ================================================= -->
    <!-- TARGET 6 -->
    <!-- MÓNICA -->
    <!-- ================================================= -->

    <a-entity
      mindar-image-target="targetIndex: 6"
      data-person-id="monica"
    ></a-entity>

  </a-scene>

  <!-- ================================================= -->
  <!-- ARCHIVOS DEL PROYECTO -->
  <!-- ================================================= -->

  <script src="./js/audio.js"></script>

  <script src="./js/app.js"></script>

  <script src="./js/ar.js"></script>

  <!-- ================================================= -->
  <!-- SISTEMA DE IMAGEN FIJA -->
  <!-- ================================================= -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {


        /* =================================================
         * ELEMENTOS
         * ================================================= */

        const container =
          document.getElementById(
            "fixed-image-container"
          );


        const image =
          document.getElementById(
            "fixed-image"
          );


        const closeButton =
          document.getElementById(
            "close-ar"
          );


        const storyCard =
          document.getElementById(
            "story-card"
          );

        /* =================================================
         * ESTADO
         * ================================================= */

        let currentTarget = null;
        let locked = false;

        /* =================================================
         * IMÁGENES
         * ================================================= */

        const images = {

          denisse:
            "./assets/images/denisse.png",

          esther:
            "./assets/images/esther-06.png",

          rubi:
            "./assets/images/rubí.png",

          maria:
            "./assets/images/maria.png",

          patricia:
            "./assets/images/patricia.png",

          monica:
            "./assets/images/monica.png"

        };
        /* =================================================
         * ELIMINAR IMAGEN
         * ================================================= */
        function removeImage() {

          console.log("Cerrando historia...");


          // ========================================
          // DETENER AUDIO
          // ========================================

          const audio =
            document.getElementById(
              "story-audio"
            );

          if (audio) {

            audio.pause();

            audio.currentTime = 0;

          }


          // ========================================
          // OCULTAR IMAGEN
          // ========================================

          container.classList.remove(
            "show"
          );


          // ========================================
          // ELIMINAR IMAGEN
          // ========================================

          image.removeAttribute(
            "src"
          );

          image.alt = "";


          // ========================================
          // DESBLOQUEAR PANEL
          // ========================================

          if (window.unlockStoryPanel) {

            window.unlockStoryPanel();

          }


          // ========================================
          // OCULTAR BOTÓN X
          // ========================================

          closeButton.classList.remove(
            "visible"
          );


          // ========================================
          // LIMPIAR TARGET ACTUAL
          // ========================================

          currentTarget = null;


          // ========================================
          // PERMITIR NUEVO ESCANEO
          // ========================================

          locked = false;


          console.log(
            "Todo cerrado. Se puede escanear nuevamente."
          );

        }
        /* =================================================
         * MOSTRAR IMAGEN
         * ================================================= */

        function showImage(
          target
        ) {

          const personId =
            target.getAttribute(
              "data-person-id"
            );
          /*
           * Obtener imagen.
           */

          const src =
            images[personId];


          if (!src) {

            console.warn(
              "No existe imagen:",
              personId
            );

            locked = false;

            currentTarget = null;

            return;

          }
          /*
           * SEGURIDAD:
           *
           * Primero eliminamos cualquier
           * imagen que pudiera existir.
           */

          container.classList.remove(
            "show"
          );


          image.removeAttribute(
            "src"
          );



          /*
           * Esperar un frame del navegador
           * para asegurarnos de que la
           * imagen anterior desapareció.
           */

          requestAnimationFrame(
            function () {


              /*
               * Colocar NUEVA imagen.
               */

              image.src = src;


              image.alt =
                "Historia de " +
                personId;



              /*
               * Mostrar.
               */

              container.classList.add(
                "show"
              );


              /*
               * Mostrar X.
               */

              closeButton.classList.add(
                "visible"
              );


              /*
               * Asegurarnos de que el
               * target AR no tenga contenido
               * visible.
               */

              target.object3D.visible =
                false;


              console.log(
                "Mostrando únicamente:",
                personId
              );

            }
          );

        }

        /* =================================================
         * TODOS LOS TARGETS
         * ================================================= */

        const targets =
          document.querySelectorAll(
            "a-entity[mindar-image-target]"
          );



        targets.forEach(
          function (target) {


            /* =============================================
             * TARGET ENCONTRADO
             * ============================================= */

            target.addEventListener(
              "targetFound",
              function () {


                const personId =
                  target.getAttribute(
                    "data-person-id"
                  );


                console.log(
                  "Detectado:",
                  personId
                );



                /*
                 * TARGET 0
                 *
                 * Es el mural 3D.
                 *
                 * No lo modificamos.
                 */

                if (
                  personId === "titulo"
                ) {

                  return;

                }



                /*
                 * Si ya existe una imagen,
                 * ignorar completamente
                 * el nuevo marcador.
                 */

                if (locked) {

                  console.log(
                    "Hay una imagen activa. Presiona X primero."
                  );

                  return;

                }



                /*
                 * Bloquear.
                 */

                locked = true;


                currentTarget =
                  target;



                /*
                 * Esperar un momento
                 * para que MindAR confirme
                 * el marcador.
                 */

                setTimeout(
                  function () {


                    if (
                      currentTarget ===
                      target &&
                      locked
                    ) {

                      showImage(
                        target
                      );

                    }

                  },
                  300
                );

              }
            );



            /* =============================================
             * TARGET PERDIDO
             * ============================================= */

            target.addEventListener(
              "targetLost",
              function () {


                console.log(
                  "Marcador perdido:",
                  target.getAttribute(
                    "data-person-id"
                  )
                );


                /*
                 * IMPORTANTE:
                 *
                 * NO eliminamos la imagen.
                 *
                 * Se queda fija.
                 */

              }
            );

          }
        );



        /* =================================================
         * BOTÓN X
         * ================================================= */

        closeButton.addEventListener(
          "click",
          function () {


            console.log(
              "Botón X presionado."
            );


            /*
             * Eliminar imagen.
             */

            removeImage();


            /*
             * Si había target,
             * restaurarlo.
             */

            if (
              currentTarget
            ) {
              currentTarget.object3D.visible =
                true;
            }
            /*
             * Limpiar referencia.
             */
            currentTarget =
              null;
            /*
             * IMPORTANTE:
             *
             * Permitimos nuevamente
             * escanear.
             */
            locked =
              false;
            console.log(
              "Listo para escanear otro marcador."
            );

          }
        );
      }
    );

  </script>


</body>

</html>
