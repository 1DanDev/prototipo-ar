  <text x="52" y="552" fill="#321b49" font-family="Arial, sans-serif" font-size="36" font-weight="900">¿QUÉ PROBLEMA QUIERES</text>
  <text x="52" y="595" fill="#321b49" font-family="Arial, sans-serif" font-size="36" font-weight="900">AYUDAR A RESOLVER?</text>
  <rect x="52" y="632" width="636" height="124" rx="22" fill="#e2d6ff"/>
  <text x="78" y="681" fill="#463254" font-family="Arial, sans-serif" font-size="22">La ingeniería también necesita empatía, imaginación</text>
  <text x="78" y="718" fill="#463254" font-family="Arial, sans-serif" font-size="22">y perspectivas distintas para transformar el mundo.</text>
  <text x="52" y="805" fill="#7044b1" font-family="Arial, sans-serif" font-size="23" font-weight="700">Toca “Saber más” para activar</text>
  <text x="52" y="838" fill="#7044b1" font-family="Arial, sans-serif" font-size="23" font-weight="700">contenido adicional.</text>
  <text x="52" y="886" fill="#463254" font-family="Arial, sans-serif" font-size="19">Esta imagen es provisional. Conserva el nombre del archivo</text>
  <text x="52" y="918" fill="#463254" font-family="Arial, sans-serif" font-size="19">o actualiza la ruta correspondiente en fanzine.html.</text>
  <text x="660" y="1000" fill="#7044b1" font-family="Arial, sans-serif" font-size="24" font-weight="700">03</text>
