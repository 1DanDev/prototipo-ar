  <text x="52" y="83" fill="#d9ccff" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">IDEAS EN MOVIMIENTO</text>
  <text x="52" y="164" fill="#fff" font-family="Arial, sans-serif" font-size="56" font-weight="900">CREAR, PROBAR,</text>
  <text x="52" y="230" fill="#d9ccff" font-family="Arial, sans-serif" font-size="56" font-weight="900">VOLVER A INTENTAR</text>
  <g transform="translate(460 278)" fill="none" stroke="#d9ccff" stroke-width="10">
