<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Test MindAR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #222;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 15px;
      background: rgba(0,0,0,.8);
      color: white;
      font-family: monospace;
      font-size: 14px;
    }

    a-scene {
      position: fixed;
      inset: 0;
    }
  </style>
</head>

<body>

<div id="status">
  Iniciando MindAR...
</div>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    uiLoading: no;
    uiScanning: no;
    uiError: no;
  "
  embedded
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-ring
      color="#c7b5ff"
      radius-inner="0.15"
      radius-outer="0.20"
      position="0 0 0.05"
      animation="
        property: rotation;
        to: 0 0 360;
        dur: 2000;
        loop: true;
        easing: linear
      ">
    </a-ring>

  </a-entity>

</a-scene>

<script>

const status = document.querySelector("#status");
const scene = document.querySelector("a-scene");
const target = document.querySelector("#target");

scene.addEventListener("arReady", () => {
  status.innerHTML = "AR READY ✅<br>Cámara inicializada";
});

scene.addEventListener("arError", (event) => {
  status.innerHTML =
    "AR ERROR ❌<br>" +
    "La cámara/AR no pudo iniciar.";
  console.error("AR ERROR", event);
});

target.addEventListener("targetFound", () => {
  status.innerHTML =
    "TARGET ENCONTRADO ✅<br>" +
    "MindAR está viendo a Denisse.";
});

target.addEventListener("targetLost", () => {
  status.innerHTML =
    "TARGET PERDIDO<br>" +
    "Cámara funcionando.";
});

</script>

</body>
</html>
