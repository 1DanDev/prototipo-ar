<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241333">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Página del fanzine · Historias que inspiran</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/app-icon-192.png">
  <link rel="stylesheet" href="./css/historia.css?v=6.1.0">
  <link rel="stylesheet" href="./css/pwa.css?v=6.1.0">
</head>

<body>
  <a class="back-link" href="./index.html" aria-label="Regresar a la cámara">
    <span aria-hidden="true">←</span>
    <span>Regresar a la cámara</span>
  </a>

  <main class="page-reader" aria-labelledby="reader-title">
    <h1 id="reader-title" class="sr-only">Página original del fanzine</h1>

    <div id="image-viewport" class="image-viewport">
      <figure id="paper-frame" class="page-sheet is-loading">
        <img id="article-image" class="article-image"
          src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
          alt="Página original del fanzine" draggable="false">
        <figcaption id="article-caption" class="sr-only"></figcaption>
      </figure>
    </div>

    <nav class="reader-controls" aria-label="Controles del visor">
      <button id="previous-story" class="round-button" type="button"
        aria-label="Ver la página de la historia anterior">←</button>

      <p id="article-status" aria-live="polite">Cargando página…</p>

      <button id="next-story" class="round-button" type="button"
        aria-label="Ver la página de la historia siguiente">→</button>

      <button id="zoom-article" class="zoom-button" type="button" aria-pressed="false">
        <span aria-hidden="true">⌕</span>
        <span>Ampliar</span>
      </button>
    </nav>
  </main>

  <script src="./js/historia.js?v=6.1.0"></script>
  <script src="./js/pwa.js?v=6.1.0"></script>
</body>

</html>
